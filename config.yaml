global:
  port: 3000

rules:
  - name: "community"
    description: "Only the game client may fetch community content"
    conditions:
      - field: path
        operator: starts_with
        value: "/community"
      - field: user_agent
        operator: not_equals
        value: "Half-Life 2"
    action: deny
    message: "Forbidden"
    status: 403

  - name: "block-source-files"
    description: "Never serve plugin source files"
    conditions:
      - field: ext
        operator: in
        value: [".inc", ".sp", ".smx", ".cfg"]
    action: deny
    message: "Forbidden"
    status: 403

