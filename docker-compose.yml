services:
  fastdl:
    build:
      context: .
      dockerfile: Dockerfile
    image: fastdl
    container_name: fastdl
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
    volumes:
      - ./storage:/app/storage
      - ./auto:/app/auto
      - ./config.yaml:/app/config.yaml:ro
