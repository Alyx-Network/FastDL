[package]
name = "fastdl"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
regex = "1"
ipnet = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
arc-swap = "1"
notify = "6"
mime_guess = "2"
percent-encoding = "2"
tokio-util = { version = "0.7", features = ["io"] }
flate2 = "1.1.9"
bzip2 = "0.6.1"

[profile.release]
opt-level = 3
lto = true
